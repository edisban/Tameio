# Serves the built React app and forwards /api to Spring Boot, so the browser talks to one origin
# Docker's DNS, asked again every 10 s, so replicas added with --scale join without restarting nginx
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    # Docker's DNS answers "backend" with one address per replica; nginx sends requests to them in turn.
    # A replica that refuses or times out three times is left out for 10 s (open-source nginx checks
    # passively, on real requests; compose starts nginx only once the backend reports ready).
    server backend:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 5180;
    listen [::]:5180;
    server_name _;
    root /usr/share/nginx/html;

    # Matches the API's own upload limit (10 MB file, 11 MB request)
    client_max_body_size 11m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A replica that is down or restarting: try the next one. Only for requests that are safe to repeat,
        # so an upload or a loan decision is never sent twice.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    # File names under /assets contain a content hash, so they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Every other path belongs to the app's router; index.html itself is never cached
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
