[project]
name = "tameio-credit-risk"
version = "0.1.0"
description = "Tameio credit risk: a logistic regression next to the loan scorecard, trained on a simulated loan book."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.15.12",
]
# The report's figures and the local experiment log; not needed to compute a score
report = [
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "mlflow==3.18.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["credit_risk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
