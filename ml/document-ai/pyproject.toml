[project]
name = "tameio-document-ai"
version = "0.1.0"
description = "Reads receipts and invoices: OCR, field extraction and expense classification"
requires-python = ">=3.12,<3.13"
# Exact versions: the service is an application, so every build must get the same libraries
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "pydantic==2.14.2",
    "pytesseract==0.3.13",
    "pillow==13.0.0",
    "pypdfium2==5.14.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = [
    # The error analysis of the field-extraction comparison
    "pandas==3.1.1",
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]
# The LLM variants of the field-extraction comparison; never in the service image or CI.
# PyTorch comes separately: Colab has it with CUDA, a laptop takes the CPU build
# (pip install torch --index-url https://download.pytorch.org/whl/cpu).
llm = [
    "transformers==5.23.0",
    "peft==0.22.0",
    "trl==1.18.2",
    "accelerate==1.16.0",
    "datasets==5.2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["document_ai*", "training*", "extraction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: needs the Tesseract binary (runs in the Docker image and CI)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Greek letters that look like Latin ones are deliberate in this domain (ΑΦΜ, ΦΠΑ)
ignore = ["RUF001", "RUF002", "RUF003"]
