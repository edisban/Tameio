# Production differences only: no defaults for secrets, machine-readable logs, no API explorer
spring:
  datasource:
    url: ${TAMEIO_DB_URL}
    username: ${TAMEIO_DB_USERNAME}
    password: ${TAMEIO_DB_PASSWORD}

tameio:
  auth:
    jwt-secret: ${TAMEIO_JWT_SECRET}
    secure-cookie: true
  storage:
    endpoint: ${TAMEIO_S3_ENDPOINT}
    region: ${TAMEIO_S3_REGION}
    bucket: ${TAMEIO_S3_BUCKET}
    access-key: ${TAMEIO_S3_ACCESS_KEY}
    secret-key: ${TAMEIO_S3_SECRET_KEY}
    # Provisioned with the infrastructure, not by the app
    create-bucket: false

logging:
  structured:
    # JSON log lines (Elastic Common Schema) that Loki or Elasticsearch can index
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
