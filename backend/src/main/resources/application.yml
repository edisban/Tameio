# Defaults for local development. Every value that differs per environment comes from an
# environment variable, so the same build runs everywhere (12-factor). The variables are prefixed
# with TAMEIO_ so they never pick up generic names like DB_URL set for another project.
spring:
  application:
    name: tameio-core
  datasource:
    url: ${TAMEIO_DB_URL:jdbc:postgresql://localhost:5433/tameio}
    username: ${TAMEIO_DB_USERNAME:tameio}
    password: ${TAMEIO_DB_PASSWORD:tameio}
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it
    hibernate:
      ddl-auto: validate
    # No lazy loading during view rendering: every query happens inside a service transaction
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TAMEIO_KEYCLOAK_ISSUER:http://localhost:8180/realms/tameio}
          # Tokens must be meant for this API, not just issued by our Keycloak
          audiences: tameio-api
  servlet:
    multipart:
      # Uploads are read into memory to check their type and hash, so they stay small
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    web:
      pageable:
        # Pages as {"content": [...], "page": {...}}, a stable JSON shape rather than Spring's internals
        serialization-mode: via-dto
        max-page-size: 100
  mvc:
    # Errors as RFC 9457 problem details
    problemdetails:
      enabled: true
  threads:
    # Java 21 virtual threads: blocking I/O no longer ties up a platform thread per request
    virtual:
      enabled: true

tameio:
  storage:
    endpoint: ${TAMEIO_S3_ENDPOINT:http://localhost:8333}
    region: ${TAMEIO_S3_REGION:eu-central-1}
    bucket: ${TAMEIO_S3_BUCKET:tameio-documents}
    access-key: ${TAMEIO_S3_ACCESS_KEY:tameio}
    secret-key: ${TAMEIO_S3_SECRET_KEY:tameio-dev-secret}
    create-bucket: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for load balancers and Kubernetes
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
