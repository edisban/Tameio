# Defaults for local development. Every value that differs per environment comes from an
# environment variable, so the same build runs everywhere (12-factor). The variables are prefixed
# with TAMEIO_ so they never pick up generic names like DB_URL set for another project.
spring:
  application:
    name: tameio-core
  datasource:
    url: ${TAMEIO_DB_URL:jdbc:postgresql://localhost:5433/tameio}
    username: ${TAMEIO_DB_USERNAME:tameio}
    password: ${TAMEIO_DB_PASSWORD:tameio}
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it
    hibernate:
      ddl-auto: validate
    # No lazy loading during view rendering: every query happens inside a service transaction
    open-in-view: false
  servlet:
    multipart:
      # Uploads are read into memory to check their type and hash, so they stay small
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    web:
      pageable:
        # Pages as {"content": [...], "page": {...}}, a stable JSON shape rather than Spring's internals
        serialization-mode: via-dto
        max-page-size: 100
  mvc:
    # Errors as RFC 9457 problem details
    problemdetails:
      enabled: true
  rabbitmq:
    host: ${TAMEIO_RABBITMQ_HOST:localhost}
    port: ${TAMEIO_RABBITMQ_PORT:5672}
    username: ${TAMEIO_RABBITMQ_USERNAME:tameio}
    password: ${TAMEIO_RABBITMQ_PASSWORD:tameio}
    # The outbox marks an event as sent only once RabbitMQ has confirmed it
    publisher-confirm-type: correlated
    template:
      # Verification of Payee asks the clearing house and waits at most this long for the answer
      reply-timeout: 2s
    listener:
      simple:
        # At most this many documents are read at once per instance, however many are uploaded:
        # document AI is CPU-bound, so more would only queue up inside it
        concurrency: 2
        max-concurrency: 4
        prefetch: 1
        retry:
          # Document AI unavailable: try again after 5 s, then 15 s, then give up (dead-letter queue).
          # Two retries, so three attempts in all
          enabled: true
          max-retries: 2
          initial-interval: 5s
          multiplier: 3
          max-interval: 1m
  modulith:
    events:
      # Sent events are deleted from the outbox; only those still waiting stay in the table
      completion-mode: delete
      # Events not yet sent when the app stopped are sent when it starts again
      republish-outstanding-events-on-restart: true
      jdbc:
        # Flyway owns the schema (V4__document_reading.sql)
        schema-initialization:
          enabled: false
  threads:
    # Java 21 virtual threads: blocking I/O no longer ties up a platform thread per request
    virtual:
      enabled: true

tameio:
  auth:
    # Development value only; production must set its own secret (see application-prod.yml)
    jwt-secret: ${TAMEIO_JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
    session-ttl: 8h
    secure-cookie: ${TAMEIO_SECURE_COOKIE:false}
  storage:
    endpoint: ${TAMEIO_S3_ENDPOINT:http://localhost:8333}
    region: ${TAMEIO_S3_REGION:eu-central-1}
    bucket: ${TAMEIO_S3_BUCKET:tameio-documents}
    access-key: ${TAMEIO_S3_ACCESS_KEY:tameio}
    secret-key: ${TAMEIO_S3_SECRET_KEY:tameio-dev-secret}
    create-bucket: true
  banking:
    # Lets a business add demo money to its account on a local stack; production turns it off
    demo-deposits: ${TAMEIO_DEMO_DEPOSITS:true}
    max-accounts: 5
  clearing:
    # How long the simulated clearing house takes to settle or reject a SEPA payment
    settlement-delay: 3s
  demo:
    # Local stacks only: demo people, businesses and a year of accounts and expenses (see README)
    enabled: ${TAMEIO_DEMO_DATA:false}
  bootstrap:
    # The first administrator, created only while the bank has none; the password must be changed at first sign-in
    admin-email: ${TAMEIO_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${TAMEIO_BOOTSTRAP_ADMIN_PASSWORD:}
  document-ai:
    url: ${TAMEIO_DOCUMENT_AI_URL:http://localhost:8090}
    connect-timeout: 2s
    read-timeout: 90s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for load balancers and Kubernetes
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
