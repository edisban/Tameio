# The whole Tameio stack for local use. Credentials here are for local development only.
#
# See the app, everything in containers (then open http://localhost:5180):
#   docker compose --profile app up -d --build
#
# Work on the code: only the infrastructure in containers, the backend and frontend on the host
# for a fast edit-and-reload loop:
#   docker compose up -d
#   cd backend && ./mvnw spring-boot:run
#   cd frontend && npm run dev
name: tameio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tameio
      POSTGRES_USER: tameio
      POSTGRES_PASSWORD: tameio
    # Bound to localhost only, on 5433 so it doesn't clash with another local PostgreSQL
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tameio -d tameio"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Development mode with the Tameio realm (roles, the web client, demo users) imported on first start
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    # The image has no curl; bash's /dev/tcp asks the management port whether Keycloak is ready
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  storage:
    # SeaweedFS speaks the S3 API, so the backend uses the AWS SDK and would run unchanged against AWS S3
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  document-ai:
    # OCR, field extraction and expense classification (Python, FastAPI, Tesseract, scikit-learn)
    build: ./ml/document-ai
    image: tameio/document-ai:dev
    ports:
      - "127.0.0.1:8090:8090"

  backend:
    profiles: [app]
    build: ./backend
    image: tameio/backend:dev
    environment:
      TAMEIO_DB_URL: jdbc:postgresql://postgres:5432/tameio
      TAMEIO_S3_ENDPOINT: http://storage:8333
      # Tokens say they come from localhost:8180, the address the browser used to sign in; the
      # backend checks that, but fetches Keycloak's signing keys over the container network
      TAMEIO_KEYCLOAK_ISSUER: http://localhost:8180/realms/tameio
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tameio/protocol/openid-connect/certs
      TAMEIO_DOCUMENT_AI_URL: http://document-ai:8090
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      storage: { condition: service_healthy }
      document-ai: { condition: service_healthy }

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        VITE_OIDC_AUTHORITY: http://localhost:8180/realms/tameio
        VITE_OIDC_CLIENT_ID: tameio-web
    image: tameio/frontend:dev
    ports:
      - "127.0.0.1:5180:5180"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres-data:
  storage-data:
