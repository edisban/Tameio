# Local development infrastructure: the database, the identity provider and S3-compatible file storage.
# The backend and frontend run on the host for a fast edit-and-reload loop:
#   docker compose up -d
#   cd backend && ./mvnw spring-boot:run
#   cd frontend && npm run dev
# Credentials here are for local development only.
name: tameio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tameio
      POSTGRES_USER: tameio
      POSTGRES_PASSWORD: tameio
    # Bound to localhost only, on 5433 so it doesn't clash with another local PostgreSQL
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tameio -d tameio"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Development mode with the Tameio realm (roles, the web client, demo users) imported on first start
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    # The image has no curl; bash's /dev/tcp asks the management port whether Keycloak is ready
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  storage:
    # SeaweedFS speaks the S3 API, so the backend uses the AWS SDK and would run unchanged against AWS S3
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  storage-data:
