# The whole Tameio stack for local use. Credentials here are for local development only.
#
# See the app, everything in containers (then open http://localhost:5180):
#   docker compose --profile app up -d --build
# One backend behind nginx (for three: --scale backend=3); Grafana on http://localhost:3000, Prometheus on http://localhost:9090.
#
# Work on the code: only the infrastructure (Postgres, storage, RabbitMQ, document AI) in containers, the backend and frontend on the host
# for a fast edit-and-reload loop:
#   docker compose up -d
#   cd backend && ./mvnw spring-boot:run
#   cd frontend && npm run dev
name: tameio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tameio
      POSTGRES_USER: tameio
      POSTGRES_PASSWORD: tameio
    # Bound to localhost only, on 5433 so it doesn't clash with another local PostgreSQL
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tameio -d tameio"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # SeaweedFS speaks the S3 API, so the backend uses the AWS SDK and would run unchanged against AWS S3
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    # Work queues: each upload becomes a reading job, retried with back-off and dead-lettered if it keeps failing.
    # Management UI on http://localhost:15672 (tameio / tameio)
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tameio
      RABBITMQ_DEFAULT_PASS: tameio
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  document-ai:
    # OCR, field extraction and expense classification (Python, FastAPI, Tesseract, scikit-learn)
    build: ./ml/document-ai
    image: tameio/document-ai:dev
    ports:
      - "127.0.0.1:8090:8090"

  backend:
    profiles: [app]
    build: ./backend
    image: tameio/backend:dev
    environment:
      TAMEIO_DB_URL: jdbc:postgresql://postgres:5432/tameio
      TAMEIO_S3_ENDPOINT: http://storage:8333
      TAMEIO_DOCUMENT_AI_URL: http://document-ai:8090
      TAMEIO_RABBITMQ_HOST: rabbitmq
      # Local only: demo people, businesses and a year of history (README lists the sign-ins)
      TAMEIO_DEMO_DATA: "true"
    # Behind nginx (the frontend container); scale it with --scale backend=3. No host port, so replicas never
    # clash over one: only nginx and Prometheus reach them, inside the Docker network.
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      document-ai: { condition: service_healthy }

  frontend:
    profiles: [app]
    build: ./frontend
    image: tameio/frontend:dev
    ports:
      - "127.0.0.1:5180:5180"
    depends_on:
      backend: { condition: service_healthy }

  prometheus:
    profiles: [app]
    # Scrapes every backend replica and RabbitMQ every 15 s, and evaluates the alert rule
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend: { condition: service_healthy }

  grafana:
    profiles: [app]
    # The dashboard and its data source are provisioned from files: nothing to set up by hand.
    # Anyone may look (anonymous viewer); to edit, sign in as admin / tameio.
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: tameio
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tameio.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  storage-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
